bspc monitor -d I II III

bspc config border_width         1
bspc config window_gap           0

bspc config split_ratio          0.50
bspc config borderless_monocle   true
bspc config gapless_monocle      true

bspc config normal_border_color  "#542000"
bspc config active_morder_color  "#B83D00"
bspc config focused_border_color "#FF5A00"

bspc rule -a Gimp desktop='^8' state=floating follow=on
bspc rule -a Chromium desktop='^2'
bspc rule -a mplayer2 state=floating
bspc rule -a Kupfer.py focus=on
bspc rule -a Screenkey manage=off

sxhkd &

polybar --config=/home/dec/.config/polybar/config.ini main &format-disconnected = NET OFF
format-disconnected-foreground = ${colors.red}

[module/volume]
type = internal/pulseaudio

format-volume = VOL %percentage%%
format-volume-foreground = ${colors.amber}

label-muted = VOL MUTED
label-muted-foreground = ${colors.red}

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d
time = %H:%M:%S

label = %date% %time%
label-foreground = ${colors.amber-bright}
