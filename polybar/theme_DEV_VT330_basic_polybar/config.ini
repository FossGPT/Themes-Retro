[colors]
background = #FF5A00
background-alt = #B83D00
foreground = #080604
foreground-alt = #542000

amber = #080604
amber-bright = #000000
amber-dark = #542000
orange = #3A1808
red = #3A1808

[bar/main]
width = 100%
height = 24
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.amber}

border-size = 0

padding-left = 1
padding-right = 1

module-margin-left = 1
module-margin-right = 1

font-0 = Monospace:size=15;2

modules-left = bspwm
modules-center = title
modules-right = cpu memory filesystem network volume date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.amber}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.amber}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.amber-dark}
label-empty-padding = 1

[module/title]
type = internal/xwindow

label = %title%
label-foreground = ${colors.amber}
label-maxlen = 60

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = "CPU "
format-prefix-foreground = ${colors.amber-dark}

label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2

format-prefix = "RAM "
format-prefix-foreground = ${colors.amber-dark}

label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
interval = 30

mount-0 = /

format-prefix = "DISK "
format-prefix-foreground = ${colors.amber-dark}

label-mounted = %percentage_used%%

[module/network]
type = internal/network
interface = eth0
interval = 2

format-connected = <label-connected>

label-connected = NET ↓%downspeed% ↑%upspeed%
label-connected-foreground = ${colors.amber}

format-disconnected = NET OFF
format-disconnected-foreground = ${colors.red}

[module/volume]
type = internal/pulseaudio

format-volume = VOL %percentage%%
format-volume-foreground = ${colors.amber}

label-muted = VOL MUTED
label-muted-foreground = ${colors.red}

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d
time = %H:%M:%S

label = %date% %time%
label-foreground = ${colors.amber-bright}
